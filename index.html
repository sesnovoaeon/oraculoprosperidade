.center{text-align:center}.eyebrow{text-align:center;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:16px}.kicker,.pill{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:7px 11px;color:var(--gold2);font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{font-size:clamp(37px,7.6vw,66px);line-height:1.02;text-align:center;margin:0 0 18px}h2{font-size:clamp(28px,5.4vw,44px);line-height:1.1;margin:0 0 15px}h3{font-size:22px;margin:0 0 10px}.gold{color:var(--gold2)}.lead{color:var(--muted);font-size:clamp(16px,2.7vw,20px);line-height:1.62;margin:0 0 24px}.lead.center{max-width:700px;margin:0 auto 24px}.micro{font-size:12px;color:#928673;line-height:1.5}.notice{border:1px solid var(--line);background:rgba(201,162,75,.065);border-radius:15px;padding:16px;color:#ded1ba;line-height:1.56;margin:20px 0}.context{border-left:3px solid var(--gold);background:rgba(255,255,255,.035);padding:14px 16px;margin:18px 0;border-radius:0 12px 12px 0;color:#dfd3bf;line-height:1.56}.context b,.notice b{color:var(--gold2)}
.btn,.option{width:100%;border-radius:14px;padding:16px 17px;cursor:pointer;transition:.18s}.btn-primary{border:1px solid var(--gold);background:linear-gradient(180deg,#d9bb72,#99712a);color:#171006;font-weight:900;box-shadow:0 12px 32px rgba(201,162,75,.15)}.btn-secondary{border:1px solid rgba(201,162,75,.35);background:transparent;color:var(--gold2);font-weight:760}.btn:hover,.option:hover{filter:brightness(1.06);transform:translateY(-1px)}.actions,.options{display:grid;gap:11px;margin-top:22px}.option{border:1px solid rgba(201,162,75,.24);background:rgba(255,255,255,.025);color:var(--ink);text-align:left;display:flex;gap:13px;align-items:flex-start}.option .mark{width:30px;height:30px;flex:0 0 auto;border:1px solid rgba(201,162,75,.42);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:12px}.option b{display:block;font-size:15px}.option small{display:block;color:var(--muted);margin-top:4px;line-height:1.43}.price-note{display:inline-flex;align-items:center;gap:7px;color:#d8c9ad;border:1px solid var(--line);background:rgba(0,0,0,.15);padding:9px 13px;border-radius:99px;font-size:12px;margin:10px auto 0}

.article{background:var(--cream);color:#211b14;border-radius:17px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.4)}.article-head{background:var(--red);color:#fff;padding:11px 17px;font-size:11px;font-weight:900;letter-spacing:.12em}.article-body{padding:clamp(20px,5vw,38px)}.article-body h2{font-family:Arial,sans-serif;font-weight:900;line-height:1.07}.article-body p{line-height:1.65;color:#453c31}.article-meta{font-size:12px;color:#766c60;border-bottom:1px solid #d9d0c2;padding-bottom:12px;margin-bottom:17px}.article-quote{border-left:4px solid #9b2d27;padding:12px 15px;background:#eae0d2;font-weight:750;line-height:1.5;margin:20px 0}.article-signal{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;border:1px solid #d4c7b4;background:#fffaf2;padding:13px;border-radius:12px;color:#4a4034}.article-signal span{font-size:28px;text-align:center}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:27px 0}.flip{width:100%;height:clamp(170px,38vw,300px);perspective:1100px;border:0;background:transparent;padding:0;cursor:pointer;display:block}.flip-inner{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .82s cubic-bezier(.2,.76,.25,1)}.flip.flipped .flip-inner{transform:rotateY(180deg)}.flip.dim{opacity:.2;filter:grayscale(.75);pointer-events:none}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;overflow:hidden;border:1px solid var(--gold);box-shadow:0 18px 42px rgba(0,0,0,.46)}.cardback{display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(242,221,162,.26),transparent 25%),repeating-linear-gradient(45deg,transparent 0 10px,rgba(242,221,162,.07) 10px 11px),linear-gradient(145deg,#54201b,#160e09)}.cardback:before,.cardback:after{content:"";position:absolute;inset:8px;border:2px solid rgba(242,221,162,.68);border-radius:9px}.cardback:after{inset:18px;border-width:1px;border-radius:50%}.cardback span{z-index:2;width:58px;height:58px;border:1px solid var(--gold2);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:31px;color:var(--gold2);background:rgba(7,6,4,.48)}.cardfront{transform:rotateY(180deg);background:#e8ddca}.cardfront img{width:100%;height:100%;object-fit:cover}.card-result{display:grid;grid-template-columns:minmax(210px,.75fr) 1.4fr;gap:25px;align-items:start}.card-result>img{width:100%;border-radius:16px;border:1px solid var(--gold);box-shadow:0 20px 55px rgba(0,0,0,.44)}.result-block{border-top:1px solid var(--line);padding:15px 0}.result-block b{display:block;color:var(--gold2);font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px}.forecast{border:1px solid rgba(120,147,94,.45);background:rgba(120,147,94,.09);border-radius:15px;padding:16px;line-height:1.58}.warning{border:1px solid rgba(153,73,63,.48);background:rgba(153,73,63,.09);border-radius:15px;padding:16px;line-height:1.58}

/* V7 — cartas reais, autoridade e prova social robustas */
.cardfront{background:#f4ead2}
.cardfront img{width:100%;height:100%;object-fit:contain;background:#f4ead2}
.deck-note{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 2px;color:#d9c9a8;font-size:12px}
.deck-note strong{color:var(--gold2)}
.card-source{font-size:11px;color:#8f836f;line-height:1.5;margin-top:12px}
.authority-v7{display:grid;grid-template-columns:minmax(250px,.78fr) 1.35fr;gap:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#1a120a,#0a0806);box-shadow:var(--shadow)}
.authority-photo{position:relative;min-height:640px;background:#0d0906}
.authority-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.authority-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(7,5,3,.9) 100%)}
.authority-photo-label{position:absolute;z-index:2;left:18px;right:18px;bottom:18px;padding:13px 14px;border:1px solid rgba(242,221,162,.45);border-radius:13px;background:rgba(7,5,3,.78);backdrop-filter:blur(8px)}
.authority-photo-label b{display:block;color:#fff0c9;font-family:Georgia,serif;font-size:21px}
.authority-photo-label span{color:#cabd9f;font-size:12px}
.authority-content{padding:clamp(25px,5vw,48px)}
.authority-intro{font-family:Georgia,serif;font-size:clamp(20px,3vw,28px);line-height:1.46;color:#fff0cf;border-left:3px solid var(--gold);padding-left:17px;margin:20px 0}
.authority-points{display:grid;gap:10px;margin:20px 0}
.authority-point{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;border:1px solid rgba(201,162,75,.2);border-radius:13px;padding:13px;background:rgba(255,255,255,.025)}
.authority-point span{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold2);font-family:Georgia,serif}
.authority-point b{display:block;color:#f5e5bd;margin-bottom:3px}
.authority-point small{display:block;color:var(--muted);line-height:1.46}
.authority-proof{border:1px solid rgba(120,147,94,.45);background:rgba(120,147,94,.08);border-radius:14px;padding:15px;line-height:1.55;margin:18px 0;color:#dfe7d7}
.testimonial{position:relative}
.testimonial-button{border:0;padding:0;color:inherit;text-align:left;cursor:zoom-in;width:100%;background:#0c0906}
.testimonial-button:hover{filter:brightness(1.04)}
.testimonial-zoom{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#e7d7b3;font-size:12px;margin-top:9px}
.testimonial-zoom span:last-child{border:1px solid var(--line);padding:5px 8px;border-radius:99px}
.proof-context{border:1px solid rgba(201,162,75,.22);background:rgba(201,162,75,.055);border-radius:14px;padding:15px;line-height:1.56;margin:16px 0;color:#d9cdb7}
.proof-context b{color:var(--gold2)}
.testimonial-modal{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.92)}
.testimonial-modal.open{display:flex}
.testimonial-modal img{max-width:min(520px,94vw);max-height:88vh;object-fit:contain;border-radius:14px;border:1px solid var(--gold);box-shadow:0 25px 90px #000}
.modal-close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:#17100a;color:#fff1cf;font-size:25px;cursor:pointer}
.real-card-badge{display:inline-flex;gap:7px;align-items:center;border:1px solid rgba(120,147,94,.5);background:rgba(120,147,94,.09);padding:7px 10px;border-radius:99px;color:#dce7d6;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.offer-purpose{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;color:#d7cbb6;line-height:1.5}
.offer-purpose b{color:var(--gold2)}
@media(max-width:720px){
 .authority-v7{grid-template-columns:1fr}
 .authority-photo{min-height:430px}
 .authority-content{padding:22px 18px 26px}
 .cards{gap:8px}
 .flip{height:clamp(190px,56vw,285px)}
 .testimonials{grid-template-columns:1fr}
}


/* V8 — correções finais de baralho, autoridade e prova social */

.authority-v8-id{padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#0d0906}

.authority-v8-grid{display:grid;gap:10px;margin:18px 0}
.authority-v8-item{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;border:1px solid rgba(201,162,75,.22);border-radius:14px;padding:14px;background:rgba(255,255,255,.025)}
.authority-v8-item>span{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold2);font-family:Georgia,serif}
.authority-v8-item b{display:block;color:#f5e5bd;margin-bottom:3px}
.authority-v8-item small{display:block;color:var(--muted);line-height:1.48}
.authority-v8-proof{border:1px solid rgba(120,147,94,.45);background:rgba(120,147,94,.08);border-radius:14px;padding:15px;line-height:1.58;margin:16px 0;color:#dfe7d7}
.testimonials-v8{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:20px 0}
.testimonial-v8{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#0b0805;color:inherit;text-align:left;padding:0;cursor:zoom-in;box-shadow:0 15px 40px rgba(0,0,0,.24)}
.testimonial-v8:hover{filter:brightness(1.04);transform:translateY(-1px)}
.testimonial-v8-image{background:#070503;padding:10px;border-bottom:1px solid var(--line)}
.testimonial-v8-image img{width:100%;height:420px;object-fit:contain;display:block;border-radius:10px;background:#fff}
.testimonial-v8-copy{padding:15px}

function tarotFallback(name,original,roman=''){
  const safe=String(name).replace(/[&<>"']/g,'');
  const sub=String(original).replace(/[&<>"']/g,'');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000">
  <rect width="600" height="1000" rx="26" fill="#120d08"/>
  <rect x="24" y="24" width="552" height="952" rx="20" fill="#1b130c" stroke="#c9a24b" stroke-width="5"/>
  <text x="300" y="390" text-anchor="middle" font-family="Georgia" font-size="56" fill="#f2dda2">${safe}</text>
  <text x="300" y="455" text-anchor="middle" font-family="Arial" font-size="25" fill="#cbbd9e">${sub}</text>
  <text x="300" y="560" text-anchor="middle" font-family="Arial" font-size="24" fill="#e7d6b2">IMAGEM OFICIAL INDISPONÍVEL</text>
  <text x="300" y="610" text-anchor="middle" font-family="Arial" font-size="20" fill="#9f927c">Recarregue a página para carregar a carta real.</text>
  </svg>`;
  return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)))
}

function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function jump(n){state.step=Math.max(0,Math.min(STEPS.length-1,Number(n)||0));save();render()}
function optData(key,id){return DATA[key].options.find(o=>o.id===id)}
function label(key){return optData(key,state.answers[key])?.label||'Não informado'}
function detail(key){return optData(key,state.answers[key])?.detail||''}
function echo(key){return optData(key,state.answers[key])?.echo||''}
function answer(key,id){state.answers[key]=id;save();track(key+'_answered',{value:id});next()}

function scores(){const s={pressure:8,cycle:8,potential:8,control:8,essential:0,complete:0,ritual:0};for(const [k,id] of Object.entries(state.answers)){const o=optData(k,id);if(o?.scores)for(const [a,v] of Object.entries(o.scores))s[a]=(s[a]||0)+v}if(state.card){for(const [a,v] of Object.entries(state.card.scores||{}))s[a]=(s[a]||0)+v;for(const [a,v] of Object.entries(state.card.offer||{}))s[a]=(s[a]||0)+v}const duration=state.answers.duration;if(duration==='years'){s.complete+=3;s.ritual+=1}if(state.answers.pain==='pressure')s.essential+=2;return s}
function profile(){const s=scores(),axes=['pressure','cycle','potential','control'];const top=axes.sort((a,b)=>s[b]-s[a])[0];const map={pressure:{name:'Pressão convertida em sobrevivência',short:'Pressão e urgência',truth:'Você pode estar usando quase toda a sua energia para evitar que algo piore, e pouca energia sobra para construir o que deveria melhorar.',shadow:'A urgência faz decisões de curto prazo parecerem as únicas decisões possíveis.',opening:'recuperar margem mental e material antes de escolher o próximo movimento'},cycle:{name:'Ciclo de recomeço sem consolidação',short:'Ciclos e instabilidade',truth:'Você possui movimento e capacidade de reagir, mas o avanço perde força antes de se transformar em estabilidade.',shadow:'Cada novo começo devolve esperança, mas também evita encarar o ponto em que a continuidade costuma quebrar.',opening:'sustentar uma direção depois que a empolgação inicial desaparece'},potential:{name:'Potencial disperso entre possibilidades',short:'Potencial e expansão',truth:'Existe capacidade real de crescimento, porém ela pode estar dividida entre ideias, tarefas e oportunidades que competem entre si.',shadow:'Quando tudo parece possível, nada recebe profundidade suficiente para amadurecer.',opening:'escolher onde concentrar força e transformar possibilidade em estrutura'},control:{name:'Proteção que se transformou em contenção',short:'Controle e proteção',truth:'Você busca segurança porque aprendeu que errar custa caro, mas essa proteção pode estar impedindo o movimento necessário.',shadow:'A mente pede certeza total antes de agir, embora a certeza só pudesse aparecer depois de um primeiro passo.',opening:'separar risco real de medo antecipado e criar movimento protegido'}};return {...map[top],key:top,scores:s}}
function recommended(){const s=scores();if(state.answers.readiness==='ritual')return 'ritual';if(state.answers.readiness==='essential'||state.answers.objection==='price')return 'essential';if(s.ritual>s.complete+4)return 'ritual';return s.complete>=s.essential?'complete':'essential'}
