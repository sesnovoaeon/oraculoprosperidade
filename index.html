function scores(){const s={pressure:8,cycle:8,potential:8,control:8,essential:0,complete:0,ritual:0};for(const [k,id] of Object.entries(state.answers)){const o=optData(k,id);if(o?.scores)for(const [a,v] of Object.entries(o.scores))s[a]=(s[a]||0)+v}if(state.card){for(const [a,v] of Object.entries(state.card.scores||{}))s[a]=(s[a]||0)+v;for(const [a,v] of Object.entries(state.card.offer||{}))s[a]=(s[a]||0)+v}const duration=state.answers.duration;if(duration==='years'){s.complete+=3;s.ritual+=1}if(state.answers.pain==='pressure')s.essential+=2;return s}

case 22:{const c=state.card||CARDS[0],p=profile();h=`<div class="eyebrow">Tendência simbólica e ponto de virada</div><h2>O futuro não está decidido, mas o padrão atual já aponta uma direção.</h2><div class="card-result"><img src="${c.img}" alt="${c.name}"><div><span class="pill">${p.short}</span><h3>Se nada mudar</h3><div class="warning">${prediction()}</div><h3 style="margin-top:18px">O ponto de virada</h3><div class="forecast">A tendência muda quando você consegue ${p.opening}. A carta ${c.name} indica que o próximo avanço depende menos de esperar um sinal perfeito e mais de transformar percepção em decisão protegida.</div></div></div><button class="btn btn-primary" onclick="next()">RECEBER MEU PLANO INICIAL</button>`;break}
case 23:h=`<div class="eyebrow">Valor entregue antes da oferta</div><h2>Três movimentos para começar a romper o padrão.</h2><p class="lead">Este plano não substitui a consulta, mas oferece uma direção prática para você observar desde agora.</p>${planHtml()}<button class="btn btn-primary" onclick="next()">VER MAIS RELATOS E A RECOMENDAÇÃO PARA MIM</button>`;break;
case 24:h=`<div class="eyebrow">Mais relatos reais</div><h2>Resultados relatados em outros trabalhos de prosperidade da SES.</h2><div class="testimonials"><div class="testimonial"><img src="${ASSETS.t6}" alt="Relato real sobre clientes e pagamentos"><div class="testimonial-copy"><b>Retorno de clientes e novos pagamentos</b><p class="micro">Experiência relatada após trabalho coletivo de Mammon.</p></div></div><div class="testimonial"><img src="${ASSETS.t10}" alt="Relato real sobre concretização material"><div class="testimonial-copy"><b>Concretização de pedido material e movimento profissional</b><p class="micro">Experiência relatada após trabalho coletivo de Mammon.</p></div></div></div><p class="transparency">Relatos reais não funcionam como promessa. Cada situação possui contexto, decisões, condições materiais e respostas próprias.</p><button class="btn btn-primary" onclick="next()">VER AS FORMAS DE APROFUNDAR MINHA LEITURA</button>`;break;
case 25:{const rec=recommended();h=`<div class="eyebrow">Recomendação personalizada</div><h2>Escolha o nível de profundidade que faz sentido para o seu momento.</h2><p class="lead">A sua escolha anterior foi “${esc(label('readiness'))}”. A opção destacada considera suas respostas, mas a decisão permanece sua.</p><div class="offer-grid"><div class="offer ${rec==='essential'?'recommended':''}">${rec==='essential'?'<span class="recommended-tag">MAIS COERENTE COM SUAS RESPOSTAS</span>':''}<h3>Leitura Financeira Essencial</h3><div class="price">R$ 67</div><ul class="features"><li>Uma questão financeira central</li><li>Tiragem objetiva com três cartas</li><li>Identificação do ponto de atenção principal</li><li>Orientação direta para o próximo movimento</li><li>Entrega em formato definido com Danielle</li></ul><button class="btn btn-primary" data-testid="offer-essential" onclick="chooseProduct('essential')">ESCOLHER A LEITURA DE R$ 67</button></div><div class="offer ${rec==='complete'?'recommended':''}">${rec==='complete'?'<span class="recommended-tag">MAIS COERENTE COM SUAS RESPOSTAS</span>':''}<h3>Consulta Financeira Completa</h3><div class="price">R$ 97</div><ul class="features"><li>Análise do momento financeiro atual</li><li>Padrões, obstáculos e influências</li><li>Decisões e possibilidades em avaliação</li><li>Leitura mais profunda das cartas</li><li>Direção individual para próximos passos</li><li>Atendimento agendado por áudio ou vídeo, conforme definição</li></ul><button class="btn btn-primary" data-testid="offer-complete" onclick="chooseProduct('complete')">ESCOLHER A CONSULTA DE R$ 97</button></div><div class="offer ${rec==='ritual'?'recommended':''}">${rec==='ritual'?'<span class="recommended-tag">ROTA INDICADA PARA AVALIAÇÃO</span>':''}<h3>Consulta + Abertura de Caminhos</h3><div class="price" style="font-size:30px">Valor a confirmar</div><ul class="features"><li>Consulta Financeira Completa</li><li>Avaliação da coerência ritualística</li><li>Ritual individual de abertura de caminhos, quando indicado</li><li>Orientações antes e depois do trabalho</li><li>Escopo e investimento confirmados por Danielle</li></ul><button class="btn btn-primary" data-testid="offer-ritual" onclick="chooseProduct('ritual')">SOLICITAR AVALIAÇÃO DESTA OPÇÃO</button></div></div>`;break}
case 26:{
  const p=productInfo();
  const header=`<div class="eyebrow">Pagamento e confirmação</div><h2>${p.name}</h2><div class="summary"><div><b>Investimento</b><span>${p.price}</span></div><div><b>Diagnóstico predominante</b><span>${profile().name}</span></div><div><b>Carta</b><span>${state.card?.name||''}</span></div></div>`;
  let paymentBody='';
  if(state.product==='ritual'){
    paymentBody=`<div class="notice"><b>Esta opção permanece em avaliação.</b><br>Danielle precisa confirmar escopo, valor e indicação antes do pagamento.</div><button class="btn btn-primary" onclick="choosePayment('evaluation')">SOLICITAR CONFIRMAÇÃO COM DANIELLE</button>`;
  }else{
    const pixLocked=!CONFIG.pixKey?'locked':'';
    const cardUrl=state.product==='essential'?CONFIG.checkoutCard67:CONFIG.checkoutCard97;
    const cardLocked=!cardUrl?'locked':'';
    paymentBody=`<p class="lead">Na versão final, a pessoa poderá pagar por Pix ou cartão. As duas opções ficarão acessíveis nesta tela.</p><div class="payment-grid"><div class="payment ${pixLocked}"><h3>Pix</h3><p>Pagamento à vista e envio do comprovante no WhatsApp.</p><button class="btn btn-primary" data-testid="pay-pix" onclick="choosePayment('pix')">${CONFIG.pixKey?'COPIAR CHAVE PIX':'SIMULAR PAGAMENTO POR PIX'}</button></div><div class="payment ${cardLocked}"><h3>Cartão de crédito</h3><p>Link seguro de pagamento, com condições definidas pela plataforma.</p><button class="btn btn-secondary" data-testid="pay-card" onclick="choosePayment('card')">SIMULAR PAGAMENTO NO CARTÃO</button></div></div>`;
  }
  const continuation=state.payment?`<div class="notice"><b>Modo demonstração.</b><br>Nenhum pagamento foi processado. Na versão de produção, após a confirmação, o sistema libera a mensagem para Danielle com os dados e solicita o comprovante.</div><button class="btn btn-primary" data-testid="payment-next" onclick="next()">VER A CONTINUIDADE PÓS-PAGAMENTO</button>`:'';
  h=header+paymentBody+continuation;
  break;
}
case 27:h=`<div class="eyebrow">Continuidade pós-pagamento</div><h2>Depois do investimento, resta apenas confirmar o comprovante e combinar o horário.</h2><p class="lead">A pessoa não precisará explicar tudo novamente. O Oráculo preenche a mensagem com o diagnóstico, a carta e a opção escolhida.</p><div class="message">${esc(message())}</div><div class="notice"><b>Fluxo de produção:</b><br>Pagamento confirmado → mensagem liberada → envio do comprovante → combinação do horário. Na segunda fase, esse último passo será substituído por um site de agendamento.</div><button class="btn btn-primary" onclick="reset()">CONCLUIR A SIMULAÇÃO</button>`;break;
}app.innerHTML=`<div class="content">${h}</div>`;window.scrollTo({top:0,behavior:'smooth'});if(CONFIG.review)setupReview()}
function setupReview(){const box=document.getElementById('review'),sel=document.getElementById('stepSelect');box.classList.add('show');if(!sel.options.length)STEPS.forEach((s,i)=>sel.add(new Option(`${i+1}. ${s}`,i)));sel.value=state.step;document.getElementById('jumpBtn').onclick=()=>jump(sel.value);document.getElementById('resetBtn').onclick=reset}
captureUtm();restore();const initial=new URLSearchParams(location.search).get('step');if(initial!==null)state.step=Math.max(0,Math.min(STEPS.length-1,Number(initial)));render();Object.assign(window,{next,jump,reset,answer,chooseCard,newSpread,submitLead,chooseProduct,choosePayment});
})();

</script>
